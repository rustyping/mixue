<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Kasir Mixue Kebalen</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; user-select: none; -webkit-user-select: none; }
    
    /* Layout Utama */
    .card { max-width: 550px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }

    /* Tag Versi di Pojok Kanan Atas */
    .version-tag { position: absolute; top: 12px; right: 15px; font-size: 0.75em; color: #888; font-weight: 600; }
    
    h2 { text-align: center; color: #e60012; margin-top: 0; margin-bottom: 5px; }
    .section-title { font-weight: bold; color: #e60012; border-bottom: 2px solid #e60012; padding-bottom: 5px; margin: 20px 0 10px 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.88em; color: #333; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; user-select: text; -webkit-user-select: text; }
    textarea { resize: vertical; min-height: 70px; }
    input[readonly] { background-color: #e9ecef; }
    .total-box { background: #ffe6e6; border: 1px solid #ffb3b3; padding: 12px; border-radius: 8px; font-size: 1.1em; font-weight: bold; color: #cc0000; text-align: center; margin: 15px 0; }
    .qty-total-box { background: #e8f8f5; border: 1px solid #2ecc71; padding: 10px; border-radius: 8px; font-size: 1em; font-weight: bold; color: #1e8449; text-align: center; margin: 15px 0; }
    button { width: 100%; padding: 12px; background-color: #e60012; color: white; border: none; border-radius: 6px; font-size: 1.05em; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #cccccc; }
    .row-2 { display: flex; gap: 10px; }
    .row-2 .form-group { flex: 1; }

    /* Styling Pop-up (Password & Summary) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-header { font-size: 1.2em; font-weight: bold; color: #333; border-bottom: 2px solid #e60012; padding-bottom: 8px; margin-bottom: 15px; text-align: center; }
    
    .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.9em; }
    .summary-table td { padding: 6px 8px; border-bottom: 1px solid #eee; }
    .summary-table td:nth-child(1) { font-weight: 600; color: #555; width: 55%; }
    .summary-table td:nth-child(2) { text-align: right; font-weight: bold; color: #111; }
    
    .btn-wa { background-color: #25d366; color: white; font-weight: bold; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; padding: 12px; border: none; cursor: pointer; width: 100%; font-size: 1em; }
    .btn-close { background-color: #6c757d; margin-top: 8px; }

    /* Modal Password Specific */
    #modalPassword { display: flex; }
    .login-box { text-align: center; }
    .login-box input { text-align: center; font-size: 1.3em; letter-spacing: 5px; margin-top: 10px; }
    .error-msg { color: #e60012; font-size: 0.85em; font-weight: bold; margin-top: 8px; display: none; }
    
    .loading-state { text-align: center; padding: 20px; color: #666; font-size: 0.9em; }
  </style>
</head>
<body>

<!-- POP-UP LAYAR PASSWORD (KUNCI AKSES) -->
<div class="modal-overlay" id="modalPassword">
  <div class="modal-content login-box">
    <div class="modal-header">🔒 Akses Kasir Mixue Kebalen</div>
    <p style="font-size: 0.9em; color: #555;">Masukkan Kode Akses untuk Membuka Form Laporan:</p>
    <form id="passForm">
      <input type="password" id="inputPass" placeholder="****" maxlength="8" required autofocus>
      <div class="error-msg" id="errorPass">❌ Kode Akses Salah!</div>
      <button type="submit" style="margin-top: 15px;">Masuk / Buka Form 🔓</button>
    </form>
  </div>
</div>

<div class="card">
  <span class="version-tag">v2.0-Dynamic</span>
  <h2>🍦 Laporan Kasir Mixue Kebalen</h2>
  <form id="kasirForm">
    
    <!-- INFO KASIR & TANGGAL -->
    <div class="row-2">
      <div class="form-group">
        <label>Hari</label>
        <input type="text" id="hari" required readonly>
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input type="text" id="tanggal" required readonly>
      </div>
    </div>

    <div class="form-group">
      <label>Nama Kasir / Shift</label>
      <input type="text" id="namaKasir" placeholder="Contoh: Silva / Dian" required>
    </div>

    <!-- KONTAINER DINAMIS BERDASARKAN KATALOG KASIR -->
    <div id="dynamicKatalogContainer">
      <div class="loading-state">Memuat katalog kasir dari Google Sheet...</div>
    </div>

    <!-- CATATAN LAINNYA -->
    <div class="section-title">🎈 Catatan Tambahan</div>

    <div class="form-group">
      <label>Ket. Boneka (Detail Jenis)</label>
      <input type="text" id="boneka" placeholder="Contoh: Snow King 1, Mini Snowman 1 (isi - jika kosong)">
    </div>

    <div class="form-group">
      <label>Uang Odong-Odong (Rp)</label>
      <input type="text" id="odong" placeholder="0" class="nominal-single">
    </div>

    <div class="form-group">
      <label>Catatan Opsional</label>
      <textarea id="catatan" placeholder="Tulis catatan jika ada kendala, selisih, atau info tambahan..."></textarea>
    </div>

    <button type="submit" id="btnNext" disabled>Memuat Data...</button>
  </form>
</div>

<!-- MODAL / JENDELA POP-UP SUMMARY -->
<div class="modal-overlay" id="modalRincian">
  <div class="modal-content">
    <div class="modal-header">📋 Summary Laporan Kasir</div>
    <p style="text-align: center; font-size: 0.85em; color: #666; margin-top: -10px;">Periksa kembali data sebelum menyimpan & mengirim ke WhatsApp Group:</p>
    
    <table class="summary-table" id="tabelRincian">
      <!-- Data Rincian Ditempel Lewat JS -->
    </table>

    <div id="modalStatus" style="text-align: center; font-weight: bold; margin-bottom: 10px;"></div>

    <button type="button" class="btn-wa" id="btnSimpanWA" onclick="simpanDanKirimWA()">📲 Simpan Data & Kirim ke WA Group</button>
    <button type="button" class="btn-close" onclick="tutupModal()">Cek Ulang / Edit Form</button>
  </div>
</div>

<!-- IFRAME & FORM TERSEMBUNYI -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="hiddenGoogleForm" action="https://script.google.com/macros/s/AKfycbz9AibDxDF8kFUFW6hvZvDBsDEMzIghv6_KfmNPOpihTioMhSJs7VzUPH8_JB2xx6Yv/exec" method="POST" target="hidden_iframe" style="display:none;">
</form>

<script>
  // --- FITUR MENCEGAH KLIK KANAN & INSPECT ELEMENT ---
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) || (e.ctrlKey && ['u','U','s','S'].includes(e.key))) {
      e.preventDefault();
    }
  });

  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz9AibDxDF8kFUFW6hvZvDBsDEMzIghv6_KfmNPOpihTioMhSJs7VzUPH8_JB2xx6Yv/exec";
  const PASSWORD_RAHASIA = "3108";
  let globalKatalog = [];
  let currentPayload = {};

  // --- CEK PASSWORD ---
  document.getElementById('passForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const passInput = document.getElementById('inputPass').value;
    const errorMsg = document.getElementById('errorPass');

    if (passInput === PASSWORD_RAHASIA) {
      document.getElementById('modalPassword').style.display = 'none';
      errorMsg.style.display = 'none';
    } else {
      errorMsg.style.display = 'block';
      document.getElementById('inputPass').value = '';
      document.getElementById('inputPass').focus();
    }
  });

  // Auto Set Hari & Tanggal
  const now = new Date();
  const hariList = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  document.getElementById('hari').value = hariList[now.getDay()];
  const options = { year: 'numeric', month: 'short', day: 'numeric' };
  document.getElementById('tanggal').value = now.toLocaleDateString('id-ID', options);

  // --- FETCH KATALOG KASIR SAAT HALAMAN DIBUKA ---
  window.onload = function() {
    fetch(WEB_APP_URL + "?action=getKatalogKasir")
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          globalKatalog = res.data;
          renderDynamicForm(globalKatalog);
        } else {
          throw new Error("Gagal mengambil data katalog kasir");
        }
      })
      .catch(err => {
        document.getElementById('dynamicKatalogContainer').innerHTML = 
          `<div style="color:red; text-align:center; padding:15px;">Gagal memuat katalog: ${err.message}</div>`;
      });
  };

  // --- RENDER FORM SECARA OTOMATIS DARI SHEET ---
  function renderDynamicForm(katalog) {
    // Kelompokkan berdasarkan kategori
    let grouped = {};
    katalog.forEach((item, index) => {
      let cat = item.kategori || 'Lainnya';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push({ ...item, originalIndex: index });
    });

    let html = '';
    for (let cat in grouped) {
      html += `<div class="section-title">📦 ${cat}</div>`;
      
      let items = grouped[cat];
      for (let i = 0; i < items.length; i += 2) {
        html += `<div class="row-2">`;
        
        // Kolom Kiri
        html += renderItemInput(items[i]);
        
        // Kolom Kanan (jika ada)
        if (items[i + 1]) {
          html += renderItemInput(items[i + 1]);
        } else {
          html += `<div class="form-group"></div>`; // Placeholder kosong agar sejajar
        }
        
        html += `</div>`;
      }
    }

    // Kotak Total Omset (Group 1) & Total Item (Group 2)
    html += `
      <div class="total-box">
        Total Omset: Rp <span id="totalOmset">0</span>
      </div>
      <div class="qty-total-box">
        Total Penjualan Item: <span id="totalPenjualanQty">0</span> Pcs
      </div>
    `;

    document.getElementById('dynamicKatalogContainer').innerHTML = html;
    document.getElementById('btnNext').disabled = false;
    document.getElementById('btnNext').innerText = "Lanjutkan / Buka Summary ➡️";

    setupEventListeners();
  }

  function renderItemInput(item) {
    let cssClass = item.group === 1 ? 'input-omset' : 'input-item';
    let inputType = item.group === 1 ? 'text' : 'number';
    let placeholder = item.group === 1 ? '0' : '0';

    return `
      <div class="form-group">
        <label>${item.namaBarang}</label>
        <input type="${inputType}" id="field_${item.originalIndex}" data-group="${item.group}" data-name="${item.namaBarang}" placeholder="${placeholder}" class="${cssClass}">
      </div>
    `;
  }

  // --- FORMAT ANGKA & KALKULASI REAL-TIME ---
  function formatAngkaRibu(nilai) {
    let raw = nilai.toString().replace(/[^0-9]/g, '');
    if (!raw) return '';
    return parseInt(raw, 10).toLocaleString('id-ID');
  }

  function cleanNumber(nilai) {
    return Number(nilai.toString().replace(/[^0-9]/g, '')) || 0;
  }

  function setupEventListeners() {
    const omsetInputs = document.querySelectorAll('.input-omset');
    omsetInputs.forEach(input => {
      input.addEventListener('input', function() {
        this.value = formatAngkaRibu(this.value);
        hitungTotalOmset();
      });
    });

    const itemInputs = document.querySelectorAll('.input-item');
    itemInputs.forEach(input => {
      input.addEventListener('input', function() {
        hitungTotalItem();
      });
    });

    const singleNominal = document.querySelectorAll('.nominal-single');
    singleNominal.forEach(input => {
      input.addEventListener('input', function() {
        this.value = formatAngkaRibu(this.value);
      });
    });
  }

  function hitungTotalOmset() {
    let total = 0;
    document.querySelectorAll('.input-omset').forEach(input => {
      total += cleanNumber(input.value);
    });
    document.getElementById('totalOmset').innerText = total.toLocaleString('id-ID');
    return total;
  }

  function hitungTotalItem() {
    let totalQty = 0;
    document.querySelectorAll('.input-item').forEach(input => {
      let grp = Number(input.getAttribute('data-group'));
      if (grp === 2) {
        totalQty += Number(input.value) || 0;
      }
    });
    document.getElementById('totalPenjualanQty').innerText = totalQty.toLocaleString('id-ID');
    return totalQty;
  }

  function formatRupiah(val) {
    return "Rp " + (Number(val) || 0).toLocaleString('id-ID');
  }

  // --- KLIK LANJUT / BUKA SUMMARY ---
  document.getElementById('kasirForm').addEventListener('submit', function(e) {
    e.preventDefault();

    let formData = {};
    globalKatalog.forEach((item, index) => {
      let el = document.getElementById(`field_${index}`);
      if (el) {
        if (item.group === 1) {
          formData[item.namaBarang] = cleanNumber(el.value);
        } else {
          formData[item.namaBarang] = Number(el.value) || 0;
        }
      }
    });

    currentPayload = {
      hari: document.getElementById('hari').value,
      tanggal: document.getElementById('tanggal').value,
      namaKasir: document.getElementById('namaKasir').value,
      omset: hitungTotalOmset(),
      totalPenjualan: hitungTotalItem(),
      boneka: document.getElementById('boneka').value || '-',
      odong: cleanNumber(document.getElementById('odong').value),
      catatan: document.getElementById('catatan').value || '-',
      itemsData: formData // Paket data dinamis
    };

    document.getElementById('modalStatus').innerText = "";
    document.getElementById('btnSimpanWA').disabled = false;
    document.getElementById('btnSimpanWA').innerText = "📲 Simpan Data & Kirim ke WA Group";

    tampilkanRincianModal(currentPayload, globalKatalog);
  });

  function tampilkanRincianModal(data, katalog) {
    let tableHtml = `
      <tr><td>Hari / Tanggal</td><td>${data.hari}, ${data.tanggal}</td></tr>
      <tr><td>Nama Kasir</td><td>${data.namaKasir}</td></tr>
    `;

    // Kelompokkan rincian berdasarkan kategori
    let grouped = {};
    katalog.forEach((item, index) => {
      let cat = item.kategori || 'Lainnya';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push({ ...item, originalIndex: index });
    });

    for (let cat in grouped) {
      tableHtml += `<tr style="background:#f9f9f9;"><td colspan="2" style="font-weight:bold; color:#e60012;">${cat}</td></tr>`;
      grouped[cat].forEach(item => {
        let val = data.itemsData[item.namaBarang] || 0;
        let displayVal = item.group === 1 ? formatRupiah(val) : `${val} Pcs`;
        tableHtml += `<tr><td>${item.namaBarang}</td><td>${displayVal}</td></tr>`;
      });
    }

    tableHtml += `
      <tr style="background:#ffe6e6;"><td style="color:#cc0000; font-weight:bold;">TOTAL OMSET</td><td style="color:#cc0000; font-weight:bold;">${formatRupiah(data.omset)}</td></tr>
      <tr style="background:#e8f8f5;"><td style="color:#1e8449; font-weight:bold;">TOTAL PENJUALAN ITEM</td><td style="color:#1e8449; font-weight:bold;">${data.totalPenjualan} Pcs</td></tr>
      <tr style="background:#f9f9f9;"><td colspan="2" style="font-weight:bold; color:#e60012;">Catatan Tambahan</td></tr>
      <tr><td>Ket. Boneka</td><td>${data.boneka}</td></tr>
      <tr><td>Uang Odong-Odong</td><td>${formatRupiah(data.odong)}</td></tr>
      <tr><td>Catatan</td><td>${data.catatan}</td></tr>
    `;

    document.getElementById('tabelRincian').innerHTML = tableHtml;
    document.getElementById('modalRincian').style.display = 'flex';
  }

  // --- SIMPAN DAN KIRIM KE WA ---
  function simpanDanKirimWA() {
    const btnSimpan = document.getElementById('btnSimpanWA');
    const modalStatus = document.getElementById('modalStatus');

    btnSimpan.disabled = true;
    btnSimpan.innerText = "⏳ Menyimpan Data...";
    modalStatus.style.color = "blue";
    modalStatus.innerText = "Mengirim data ke Google Sheet...";

    try {
      const hiddenForm = document.getElementById('hiddenGoogleForm');
      hiddenForm.action = WEB_APP_URL; 
      hiddenForm.innerHTML = ''; 

      // Masukkan metadata dasar
      for (const key in currentPayload) {
        if (key !== 'itemsData') {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = currentPayload[key];
          hiddenForm.appendChild(input);
        }
      }

      // Masukkan seluruh nilai item dinamis agar terbaca otomatis oleh Apps Script
      for (const itemName in currentPayload.itemsData) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = itemName; // Sesuai dengan nama header di sheet Kasir
        input.value = currentPayload.itemsData[itemName];
        hiddenForm.appendChild(input);
      }

      hiddenForm.submit();

      modalStatus.style.color = "green";
      modalStatus.innerText = "✅ Data tersimpan! Membuka WhatsApp...";

      // Format Pesan WhatsApp Dinamis
      const d = currentPayload;
      let teksWA = `*LAPORAN KASIR MIXUE KEBALEN* 🍦\n`;
      teksWA += `----------------------------------\n`;
      teksWA += `📅 *Hari/Tgl:* ${d.hari}, ${d.tanggal}\n`;
      teksWA += `👤 *Kasir:* ${d.namaKasir}\n\n`;
      
      teksWA += `💵 *RINCIAN PENDAPATAN:* \n`;
      globalKatalog.filter(i => i.group === 1).forEach(i => {
        teksWA += `• ${i.namaBarang}: ${formatRupiah(d.itemsData[i.namaBarang])}\n`;
      });
      teksWA += `----------------------------------\n`;
      teksWA += `💰 *TOTAL OMSET: ${formatRupiah(d.omset)}*\n`;
      teksWA += `----------------------------------\n\n`;

      teksWA += `📦 *PENJUALAN ITEM:* \n`;
      globalKatalog.filter(i => i.group === 2).forEach(i => {
        teksWA += `• ${i.namaBarang}: ${d.itemsData[i.namaBarang] || 0}\n`;
      });
      teksWA += `----------------------------------\n`;
      teksWA += `📊 *TOTAL PENJUALAN ITEM: ${d.totalPenjualan} Pcs*\n`;
      teksWA += `----------------------------------\n\n`;

      // Item Lainnya (Group 0)
      let group0 = globalKatalog.filter(i => i.group === 0);
      if (group0.length > 0) {
        group0.forEach(i => {
          teksWA += `• ${i.namaBarang}: ${d.itemsData[i.namaBarang] || 0}\n`;
        });
        teksWA += `----------------------------------\n`;
      }

      teksWA += `🎈 *CATATAN LAINNYA:*\n`;
      teksWA += `• Ket. Boneka: ${d.boneka}\n`;
      teksWA += `• Uang Odong-Odong: ${formatRupiah(d.odong)}\n`;
      teksWA += `• Catatan: ${d.catatan}\n`;
      teksWA += `----------------------------------\n`;
      teksWA += `_Demikian Laporan *${d.namaKasir}*. Terima Kasih 😁_`;

      const urlWA = `https://api.whatsapp.com/send?text=${encodeURIComponent(teksWA)}`;
      window.open(urlWA, '_blank');

      setTimeout(() => {
        document.getElementById('kasirForm').reset();
        document.getElementById('hari').value = hariList[now.getDay()];
        document.getElementById('tanggal').value = now.toLocaleDateString('id-ID', options);
        hitungTotalOmset();
        hitungTotalItem();
        tutupModal();
      }, 1500);

    } catch (err) {
      modalStatus.style.color = "red";
      modalStatus.innerText = "❌ Gagal menyimpan: " + err.message;
      btnSimpan.disabled = false;
      btnSimpan.innerText = "📲 Coba Simpan & Kirim WA Lagi";
    }
  }

  function tutupModal() {
    document.getElementById('modalRincian').style.display = 'none';
  }
</script>

</body>
</html>
